name: CI - FinSight Test & Build

on:
  push:
    branches: [ master, fix/stabilization ]
  pull_request:
    branches: [ master ]

jobs:
  server-tests:
    name: Server Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: finSight/server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: finSight/server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (Jest + Supertest + In-Memory Mongo)
        run: npm test -- --runInBand
        env:
          JWT_SECRET: ci_test_secret_for_automated_testing_12345
          NODE_ENV: test

  client-tests:
    name: Client Lint, Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: finSight/client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: finSight/client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Unit Tests (Vitest + React Testing Library)
        run: npm test

      - name: Verify Production Build (Vite)
        run: npm run build
